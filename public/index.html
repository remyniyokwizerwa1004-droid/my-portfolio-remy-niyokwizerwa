<html lang="en">
<head>

<title>Niyokwizerwa Remy — Electronics & Telecommunication Engineer</title>

<meta property="og:title" content="Niyokwizerwa Remy — Electronics & Telecommunication Engineer">
<meta property="og:description" content="Portfolio and CV of Niyokwizerwa Remy, based in Kigali, Rwanda.">

<meta name="theme-color" content="#0d1b22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230d1b22%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2226%22 text-anchor=%22middle%22 fill=%22%234fd1c5%22%3ENR%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0d1b22;
    --bg-alt: #10232c;
    --surface: #142b36;
    --surface-2: #1a3542;
    --border: rgba(79, 209, 197, 0.14);
    --text: #e6f1f3;
    --muted: #93adb5;
    --teal: #4fd1c5;
    --teal-dim: rgba(79, 209, 197, 0.12);
    --gold: #d4a853;
    --gold-dim: rgba(212, 168, 83, 0.12);
    --radius: 16px;
    --nav-h: 70px;
    --font-display: "Syne", system-ui, sans-serif;
    --font-body: "Plus Jakarta Sans", system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: var(--nav-h); }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-body); font-size: 16px; line-height: 1.7;
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  svg { flex-shrink: 0; }
  [hidden] { display: none !important; }

  .container { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 24px; }
  h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; }

  /* ---------- NAVIGATION ---------- */
  .nav {
    position: fixed; inset: 0 0 auto 0; height: var(--nav-h); z-index: 100;
    background: rgba(13, 27, 34, 0.75);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid transparent; transition: border-color .3s, background .3s;
  }
  .nav.scrolled { border-bottom-color: var(--border); background: rgba(13, 27, 34, 0.92); }
  .nav .container { height: 100%; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: .02em; }
  .logo span { color: var(--teal); }
  .nav-links { display: flex; gap: 4px; list-style: none; }
  .nav-links a {
    font-size: .9rem; font-weight: 500; color: var(--muted);
    padding: 8px 12px; border-radius: 8px; transition: color .2s, background .2s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--teal); background: var(--teal-dim); }
  .hamburger {
    display: none; width: 44px; height: 44px; border: 1px solid var(--border);
    background: transparent; border-radius: 10px; cursor: pointer;
    flex-direction: column; justify-content: center; align-items: center; gap: 5px;
  }
  .hamburger span { width: 20px; height: 2px; background: var(--text); border-radius: 2px; transition: transform .3s, opacity .3s; }
  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* ---------- SECTIONS (shared) ---------- */
  section { padding: 100px 0; position: relative; }
  section.alt { background: var(--bg-alt); }
  .section-head { margin-bottom: 56px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: .8rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 12px;
  }
  .eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--gold); }
  .section-title { font-size: clamp(2rem, 4vw, 2.75rem); font-weight: 700; }
  .section-title span { color: var(--teal); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px; transition: transform .3s, border-color .3s, box-shadow .3s;
  }
  .card:hover { transform: translateY(-4px); border-color: rgba(79, 209, 197, .35); box-shadow: 0 16px 40px rgba(0,0,0,.25); }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 26px; border-radius: 999px; font-weight: 600; font-size: .95rem;
    transition: transform .2s, box-shadow .2s, background .2s, color .2s, border-color .2s;
    cursor: pointer; border: 1px solid transparent; font-family: inherit;
  }
  .btn svg { width: 18px; height: 18px; }
  .btn-primary { background: var(--teal); color: #07231f; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(79, 209, 197, .35); }
  .btn-outline { border-color: var(--border); color: var(--text); background: rgba(255,255,255,.02); }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
  .btn-sm { padding: 8px 16px; font-size: .85rem; }

  .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.visible { opacity: 1; transform: none; }
  .reveal.d1 { transition-delay: .1s; } .reveal.d2 { transition-delay: .2s; } .reveal.d3 { transition-delay: .3s; }

  /* ---------- LOADING ---------- */
  .loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 200; transition: opacity .4s; }
  .loader.done { opacity: 0; pointer-events: none; }
  .loader i { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--teal-dim); border-top-color: var(--teal); animation: spin 1s linear infinite; }
  .loader p { color: var(--muted); margin-top: 14px; text-align: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- HERO ---------- */
  .hero {
    min-height: 100vh; display: flex; align-items: center;
    padding: calc(var(--nav-h) + 40px) 0 80px;
    background:
      radial-gradient(600px 400px at 85% 30%, rgba(79, 209, 197, .10), transparent 70%),
      radial-gradient(500px 400px at 10% 80%, rgba(212, 168, 83, .07), transparent 70%),
      var(--bg);
    overflow: hidden; position: relative;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(79, 209, 197, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79, 209, 197, .045) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }
  .hero .container { display: grid; grid-template-columns: 1.25fr 1fr; gap: 60px; align-items: center; position: relative; }
  .status {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 7px 16px; border-radius: 999px; font-size: .85rem; font-weight: 500;
    background: var(--teal-dim); color: var(--teal); border: 1px solid var(--border); margin-bottom: 26px;
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(79,209,197,.6); } 70% { box-shadow: 0 0 0 10px rgba(79,209,197,0); } 100% { box-shadow: 0 0 0 0 rgba(79,209,197,0); } }
  .hero-text { container-type: inline-size; min-width: 0; }
  .hero h1 { font-size: min(4.2rem, 8.6cqi); font-weight: 800; letter-spacing: -.01em; margin-bottom: 18px; overflow-wrap: break-word; }
  .hero h1 .last { color: var(--teal); display: block; }
  .hero .role { font-family: var(--font-display); font-size: clamp(1.15rem, 2.2vw, 1.5rem); font-weight: 600; color: var(--gold); margin-bottom: 14px; }
  .hero .loc { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-bottom: 22px; }
  .hero .loc svg { width: 18px; height: 18px; color: var(--teal); }
  .hero .tagline { font-size: 1.1rem; color: var(--muted); max-width: 520px; margin-bottom: 36px; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; }

  .portrait-wrap { position: relative; justify-self: center; width: min(100%, 380px); aspect-ratio: 4 / 5; }
  .portrait-wrap::before {
    content: ""; position: absolute; inset: -3px; border-radius: 34px;
    background: conic-gradient(from 180deg, var(--teal), var(--gold), var(--teal), transparent, var(--teal));
    opacity: .9; z-index: 0;
  }
  .portrait-wrap::after {
    content: ""; position: absolute; inset: -30px; border-radius: 50px; z-index: -1;
    background: radial-gradient(circle, rgba(79, 209, 197, .28), transparent 65%); filter: blur(20px);
  }
  .portrait {
    position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 32px; overflow: hidden;
    background: linear-gradient(145deg, #173847 0%, #0f2630 55%, #1c2f2a 100%);
    display: grid; place-items: center;
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }
  .portrait .initials {
    font-family: var(--font-display); font-weight: 800; font-size: clamp(5rem, 12vw, 8rem);
    background: linear-gradient(135deg, var(--teal), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .float-badge {
    position: absolute; z-index: 2; display: flex; align-items: center; gap: 10px;
    background: rgba(20, 43, 54, .92); border: 1px solid var(--border); backdrop-filter: blur(8px);
    padding: 10px 16px; border-radius: 14px; font-size: .85rem; font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: float 5s ease-in-out infinite;
  }
  .float-badge svg { width: 20px; height: 20px; }
  .float-badge.b1 { left: -28px; bottom: 16%; } .float-badge.b1 svg { color: var(--teal); }
  .float-badge.b2 { right: -22px; top: 10%; animation-delay: 1.5s; } .float-badge.b2 svg { color: var(--gold); }
  @keyframes float { 50% { transform: translateY(-10px); } }

  /* ---------- ABOUT ---------- */
  .about-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 48px; align-items: start; }
  .about-text p { color: var(--muted); font-size: 1.05rem; margin-bottom: 18px; white-space: pre-line; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 16px; margin-top: 30px; }
  .stat { padding: 20px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
  .stat b { display: block; font-family: var(--font-display); font-size: 1.9rem; color: var(--teal); line-height: 1.1; }
  .stat small { color: var(--muted); font-size: .85rem; }
  .info-card h3 { font-size: 1.2rem; margin-bottom: 20px; }
  .info-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--border); }
  .info-row:first-of-type { border-top: 0; padding-top: 0; }
  .info-row > div:last-child { min-width: 0; }
  .icon-box { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--teal-dim); color: var(--teal); flex-shrink: 0; }
  .icon-box svg { width: 20px; height: 20px; }
  .icon-box.gold { background: var(--gold-dim); color: var(--gold); }
  .info-row small { display: block; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; }
  .info-row span, .info-row a { font-weight: 500; overflow-wrap: anywhere; }
  .info-row a:hover { color: var(--teal); }

  /* ---------- TIMELINE ---------- */
  .timeline { position: relative; padding-left: 40px; max-width: 860px; }
  .timeline::before { content: ""; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--teal), var(--gold), transparent); }
  .t-item { position: relative; margin-bottom: 28px; }
  .t-item:last-child { margin-bottom: 0; }
  .t-item::before {
    content: ""; position: absolute; left: -36px; top: 30px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--bg); border: 3px solid var(--teal); box-shadow: 0 0 0 5px var(--teal-dim);
  }
  .t-item.gold::before { border-color: var(--gold); box-shadow: 0 0 0 5px var(--gold-dim); }
  .t-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 20px; margin-bottom: 6px; }
  .t-top h3 { font-size: 1.25rem; font-weight: 700; }
  .date { font-size: .8rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; white-space: nowrap; background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(212,168,83,.25); }
  .org { display: flex; align-items: center; gap: 8px; color: var(--teal); font-weight: 600; margin-bottom: 12px; }
  .org svg { width: 16px; height: 16px; }
  .t-item p, .t-item li { color: var(--muted); }
  .t-item p { white-space: pre-line; }
  .t-item ul { list-style: none; display: grid; gap: 6px; }
  .t-item li { position: relative; padding-left: 20px; }
  .t-item li::before { content: ""; position: absolute; left: 0; top: 11px; width: 8px; height: 2px; background: var(--teal); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .tag { font-size: .78rem; padding: 4px 11px; border-radius: 999px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

  /* ---------- SKILLS ---------- */
  .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
  .skill-card .icon-box { width: 52px; height: 52px; border-radius: 14px; margin-bottom: 18px; }
  .skill-card .icon-box svg { width: 24px; height: 24px; }
  .skill-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .skill-card p { color: var(--muted); font-size: .92rem; margin-bottom: 16px; }
  .meter { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--gold)); transition: width 1.4s cubic-bezier(.2,.8,.2,1); }
  .skill-card.visible .meter i { width: var(--lvl); }

  /* ---------- PROJECTS ---------- */
  .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .project { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .project-media { aspect-ratio: 16 / 10; position: relative; overflow: hidden; background: var(--surface-2); border: 0; padding: 0; width: 100%; display: block; }
  button.project-media { cursor: zoom-in; }
  .project-media > svg, .project-media > img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
  .project:hover .project-media > svg, .project:hover .project-media > img { transform: scale(1.06); }
  .photo-count {
    position: absolute; right: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px; font-size: .78rem; font-weight: 600;
    background: rgba(13,27,34,.8); color: var(--text); backdrop-filter: blur(6px);
  }
  .photo-count svg { width: 14px; height: 14px; }
  .project-body { padding: 24px; display: flex; flex-direction: column; flex: 1; }
  .project-body h3 { font-size: 1.2rem; margin-bottom: 8px; }
  .project-body p { color: var(--muted); font-size: .95rem; flex: 1; white-space: pre-line; }
  .project-body .tags { margin-top: 18px; }
  .project-body .btn { margin-top: 18px; align-self: flex-start; }

  /* ---------- LIGHTBOX ---------- */
  .lightbox { position: fixed; inset: 0; z-index: 300; background: rgba(5, 12, 16, .94); display: grid; place-items: center; padding: 60px 16px; }
  .lightbox img { max-width: min(1100px, 100%); max-height: calc(100vh - 140px); object-fit: contain; border-radius: 10px; }
  .lightbox .lb-caption { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: .9rem; }
  .lb-btn {
    position: absolute; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--border); cursor: pointer;
  }
  .lb-btn:hover { background: var(--teal); color: #07231f; }
  .lb-btn svg { width: 22px; height: 22px; }
  .lb-close { top: 16px; right: 16px; }
  .lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 16px; top: 50%; transform: translateY(-50%); }

  /* ---------- REFERENCES ---------- */
  .refs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .ref-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .avatar { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-family: var(--font-display); font-weight: 700; color: #07231f; background: linear-gradient(135deg, var(--teal), var(--gold)); }
  .ref-head h3 { font-size: 1.1rem; }
  .ref-head small { color: var(--gold); font-weight: 500; }
  .ref-org { color: var(--muted); font-size: .92rem; margin-bottom: 16px; }
  .ref-contact { display: grid; gap: 10px; padding-top: 16px; border-top: 1px solid var(--border); }
  .ref-contact a { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
  .ref-contact a:hover { color: var(--teal); }
  .ref-contact svg { width: 16px; height: 16px; color: var(--teal); }

  /* ---------- CONTACT ---------- */
  .contact-box { text-align: center; max-width: 820px; margin: 0 auto; padding: 60px 32px; background: radial-gradient(500px 250px at 50% 0%, rgba(79,209,197,.12), transparent 70%), var(--surface); }
  .contact-box:hover { transform: none; }
  .contact-box .section-title { margin-bottom: 14px; }
  .contact-box > p { color: var(--muted); max-width: 540px; margin: 0 auto 36px; font-size: 1.05rem; }
  .contact-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 36px; text-align: left; }
  .contact-item { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; background: var(--bg-alt); border: 1px solid var(--border); min-width: 0; }
  .contact-item > div { min-width: 0; }
  .contact-item small { display: block; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; }
  .contact-item span, .contact-item a { font-weight: 500; font-size: .92rem; overflow-wrap: anywhere; }
  .socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }

  footer { padding: 30px 0; border-top: 1px solid var(--border); text-align: center; color: var(--muted); font-size: .9rem; }
  footer span { color: var(--teal); }

  .to-top {
    position: fixed; right: 22px; bottom: 22px; z-index: 90;
    width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--teal); color: #07231f; display: grid; place-items: center; cursor: pointer;
    opacity: 0; visibility: hidden; transform: translateY(16px);
    transition: opacity .3s, transform .3s, visibility .3s, box-shadow .3s;
  }
  .to-top.show { opacity: 1; visibility: visible; transform: none; }
  .to-top:hover { box-shadow: 0 10px 28px rgba(79,209,197,.4); }
  .to-top svg { width: 22px; height: 22px; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 980px) {
    .projects-grid, .refs-grid { grid-template-columns: repeat(2, 1fr); }
    .about-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 860px) {
    .hamburger { display: flex; }
    .nav-links {
      position: fixed; top: var(--nav-h); left: 0; right: 0;
      flex-direction: column; gap: 2px; padding: 16px 20px 24px;
      background: rgba(13, 27, 34, .98); border-bottom: 1px solid var(--border);
      transform: translateY(-120%); opacity: 0; pointer-events: none;
      transition: transform .35s ease, opacity .35s ease;
    }
    .nav-links.open { transform: none; opacity: 1; pointer-events: auto; }
    .nav-links a { display: block; padding: 13px 14px; font-size: 1rem; }
    .hero .container { grid-template-columns: 1fr; gap: 56px; text-align: center; }
    .hero .loc, .hero-actions { justify-content: center; }
    .hero .tagline { margin-left: auto; margin-right: auto; }
    .portrait-wrap { order: -1; width: min(72vw, 300px); }
  }
  @media (max-width: 640px) {
    section { padding: 72px 0; }
    .container { padding: 0 16px; }
    .section-head { margin-bottom: 40px; }
    .projects-grid, .refs-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { padding: 14px 10px; text-align: center; }
    .stat b { font-size: 1.5rem; }
    .card { padding: 22px; }
    .timeline { padding-left: 30px; }
    .timeline::before { left: 6px; }
    .t-item::before { left: -31px; }
    .float-badge { font-size: .75rem; padding: 8px 12px; }
    .float-badge.b1 { left: -14px; } .float-badge.b2 { right: -14px; }
    .contact-box { padding: 44px 20px; }
    .hero-actions .btn { flex: 1 1 auto; justify-content: center; }

<main id="main"></main>

<footer><div class="container" id="footer"></div></footer>

<a href="#home" class="to-top" id="toTop" aria-label="Back to top"><svg><use href="#i-arrow-up"/></svg></a>

<script>
(function () {
  'use strict';

  // ---------- helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (name) => `<svg aria-hidden="true"><use href="#i-${esc(name)}"/></svg>`;
  const has = (s) => typeof s === 'string' && s.trim() !== '';
  const list = (a) => (Array.isArray(a) ? a : []);

  // Only allow safe link targets (no javascript: etc.).
  function safeUrl(u) {
    u = String(u ?? '').trim();
    if (!u) return '';
    if (/^(https?:|mailto:|tel:)/i.test(u) || u.startsWith('/api/file?id=') || u.startsWith('#')) return u;
    if (/^[\w-]+(\.[\w-]+)+/.test(u)) return 'https://' + u; // "github.com/me" -> https://github.com/me
    return '';
  }
  const telHref = (p) => 'tel:' + String(p).replace(/[^\d+]/g, '');
  const initials = (name) => String(name || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?';
  const paragraphs = (text) => String(text || '').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);

  const SOCIAL = {
    linkedin: ['LinkedIn', 'linkedin'], github: ['GitHub', 'github'], email: ['Email', 'mail'],
    website: ['Website', 'globe'], x: ['X', 'twitter'], facebook: ['Facebook', 'facebook'],
    instagram: ['Instagram', 'instagram'], youtube: ['YouTube', 'youtube'], whatsapp: ['WhatsApp', 'whatsapp'],
    other: ['Link', 'link'],
  };

  // Illustrations used for projects that don't have photos yet.
  const ART = [
    (i) => `<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="ga${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123a44"/><stop offset="1" stop-color="#0d1b22"/></linearGradient></defs><rect width="400" height="250" fill="url(#ga${i})"/><g stroke="#4fd1c5" stroke-opacity=".25" fill="none"><path d="M0 200h400M0 160h400M0 120h400M0 80h400"/></g><polyline points="20,190 70,150 120,165 170,110 220,130 270,80 320,100 380,60" fill="none" stroke="#4fd1c5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="20,210 70,195 120,200 170,175 220,185 270,160 320,170 380,145" fill="none" stroke="#d4a853" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/><g fill="#4fd1c5"><circle cx="170" cy="110" r="6"/><circle cx="270" cy="80" r="6"/><circle cx="380" cy="60" r="6"/></g></svg>`,
    (i) => `<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="gb${i}" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#2a3a2c"/><stop offset="1" stop-color="#0d1b22"/></radialGradient></defs><rect width="400" height="250" fill="url(#gb${i})"/><g fill="none" stroke="#4fd1c5" stroke-width="3" stroke-linecap="round"><path d="M150 150a70 70 0 0 1 100 0" stroke-opacity=".9"/><path d="M120 120a110 110 0 0 1 160 0" stroke-opacity=".6"/><path d="M90 90a150 150 0 0 1 220 0" stroke-opacity=".35"/></g><path d="M200 160 185 235h30Z" fill="#d4a853"/><circle cx="200" cy="160" r="9" fill="#e6f1f3"/></svg>`,
    (i) => `<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="gc${i}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0d1b22"/><stop offset="1" stop-color="#3a3220"/></linearGradient></defs><rect width="400" height="250" fill="url(#gc${i})"/><path d="M200 45 110 115v95h180v-95Z" fill="none" stroke="#d4a853" stroke-width="4" stroke-linejoin="round"/><rect x="180" y="150" width="40" height="60" rx="3" fill="#d4a853" fill-opacity=".25" stroke="#d4a853" stroke-width="3"/><circle cx="200" cy="112" r="14" fill="#4fd1c5"/><g stroke="#4fd1c5" stroke-width="2" stroke-dasharray="4 5" fill="none" stroke-opacity=".7"><path d="M214 112h90v-40M186 112H96v60M200 98V40"/></g></svg>`,
  ];

  const sectionHead = (eyebrow, title, accent) =>
    `<div class="section-head reveal"><p class="eyebrow">${esc(eyebrow)}</p><h2 class="section-title">${esc(title)} <span>${esc(accent)}</span></h2></div>`;

  // ---------- section renderers (each returns '' when there's nothing to show) ----------
  function hero(c) {
    const parts = String(c.name || '').trim().split(/\s+/);
    const last = parts.length > 1 ? parts.pop() : '';
    const photo = safeUrl(c.photo);
    const cv = safeUrl(c.cv);
    return `
<header class="hero" id="home">
  <div class="container">
    <div class="hero-text">
      ${has(c.status) ? `<div class="status reveal"><span class="dot"></span> ${esc(c.status)}</div>` : ''}
      <h1 class="reveal d1">${esc(parts.join(' '))}${last ? ` <span class="last">${esc(last)}</span>` : ''}</h1>
      ${has(c.title) ? `<p class="role reveal d1">${esc(c.title)}</p>` : ''}
      ${has(c.location) ? `<p class="loc reveal d2">${icon('pin')} ${esc(c.location)}</p>` : ''}
      ${has(c.tagline) ? `<p class="tagline reveal d2">${esc(c.tagline)}</p>` : ''}
      <div class="hero-actions reveal d3">
        <a href="#contact" class="btn btn-primary">${icon('send')} Get in touch</a>
        ${cv ? `<a href="${esc(cv)}" class="btn btn-outline" target="_blank" rel="noopener">${icon('download')} Download CV</a>` : ''}
      </div>
    </div>
    <div class="portrait-wrap reveal d2">
      <div class="portrait">
        ${photo ? `<img src="${esc(photo)}" alt="${esc(c.name)}">` : `<span class="initials" aria-label="${esc(c.name)}">${esc(initials(c.name))}</span>`}
      </div>
      <div class="float-badge b1">${icon('radio')} Telecom</div>
      <div class="float-badge b2">${icon('chip')} Electronics</div>
    </div>
  </div>
</header>`;
  }

  function about(c) {
    const paras = paragraphs(c.about);
    const stats = list(c.stats).filter((s) => has(s.value) || has(s.label));
    const rows = [];
    if (has(c.email)) rows.push(['mail', '', 'Email', `<a href="mailto:${esc(c.email.trim())}">${esc(c.email)}</a>`]);
    if (has(c.phone)) rows.push(['phone', '', 'Phone', `<a href="${esc(telHref(c.phone))}">${esc(c.phone)}</a>`]);
    if (has(c.location)) rows.push(['pin', 'gold', 'Location', `<span>${esc(c.location)}</span>`]);
    if (has(c.degree)) rows.push(['grad', 'gold', 'Degree', `<span>${esc(c.degree)}</span>`]);
    if (!paras.length && !rows.length) return '';
    return `
<section id="about">
  <div class="container">
    ${sectionHead('About me', 'Who I', 'am')}
    <div class="about-grid">
      <div class="about-text reveal">
        ${paras.map((p) => `<p>${esc(p)}</p>`).join('')}
        ${stats.length ? `<div class="stats">${stats.map((s) => `<div class="stat"><b>${esc(s.value)}</b><small>${esc(s.label)}</small></div>`).join('')}</div>` : ''}
      </div>
      ${rows.length ? `<aside class="card info-card reveal d1"><h3>Quick info</h3>${rows.map(([ic, cls, label, val]) => `
        <div class="info-row"><div class="icon-box ${cls}">${icon(ic)}</div><div><small>${label}</small>${val}</div></div>`).join('')}</aside>` : ''}
    </div>
  </div>
</section>`;
  }

  function timeline(id, eyebrow, title, accent, items, orgIcon) {
    items = list(items).filter((it) => has(it.title) || has(it.org));
    if (!items.length) return '';
    return `
<section id="${id}">
  <div class="container">
    ${sectionHead(eyebrow, title, accent)}
    <div class="timeline">
      ${items.map((it, i) => {
        const bullets = list(it.bullets).filter(has);
        const tags = list(it.tags).filter(has);
        return `
      <article class="t-item ${i % 2 ? 'gold' : ''} reveal">
        <div class="card">
          <div class="t-top"><h3>${esc(it.title)}</h3>${has(it.dates) ? `<span class="date">${esc(it.dates)}</span>` : ''}</div>
          ${has(it.org) ? `<p class="org">${icon(orgIcon(i))} ${esc(it.org)}</p>` : ''}
          ${has(it.description) ? `<p>${esc(it.description)}</p>` : ''}
          ${bullets.length ? `<ul>${bullets.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
          ${tags.length ? `<div class="tags">${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        </div>
      </article>`;
      }).join('')}
    </div>
  </div>
</section>`;
  }

  function skills(c) {
    const items = list(c.skills).filter((s) => has(s.name));
    if (!items.length) return '';
    return `
<section id="skills">
  <div class="container">
    ${sectionHead('Skills', 'What I', 'do best')}
    <div class="skills-grid">
      ${items.map((s, i) => {
        const lvl = Math.max(0, Math.min(100, Number(s.level) || 0));
        return `
      <div class="card skill-card reveal d${i % 4 || ''}" style="--lvl:${lvl}%">
        <div class="icon-box ${i % 2 ? 'gold' : ''}">${icon(s.icon || 'chip')}</div>
        <h3>${esc(s.name)}</h3>
        ${has(s.description) ? `<p>${esc(s.description)}</p>` : ''}
        ${lvl ? `<div class="meter" role="img" aria-label="${lvl}%"><i></i></div>` : ''}
      </div>`;
      }).join('')}
    </div>
  </div>
</section>`;
  }

  function projects(c) {
    const items = list(c.projects).filter((p) => has(p.title));
    if (!items.length) return '';
    return `
<section id="projects">
  <div class="container">
    ${sectionHead('Projects & gallery', "Things I've", 'built')}
    <div class="projects-grid">
      ${items.map((p, i) => {
        const imgs = list(p.images).map(safeUrl).filter(Boolean);
        const tags = list(p.tags).filter(has);
        const link = safeUrl(p.link);
        const media = imgs.length
          ? `<button class="project-media" data-gallery="${i}" aria-label="View photos of ${esc(p.title)}">
               <img src="${esc(imgs[0])}" alt="${esc(p.title)}" loading="lazy">
               ${imgs.length > 1 ? `<span class="photo-count">${icon('images')} ${imgs.length} photos</span>` : ''}
             </button>`
          : `<div class="project-media">${ART[i % ART.length](i)}</div>`;
        return `
      <article class="card project reveal d${i % 3 || ''}">
        ${media}
        <div class="project-body">
          <h3>${esc(p.title)}</h3>
          ${has(p.description) ? `<p>${esc(p.description)}</p>` : '<p></p>'}
          ${tags.length ? `<div class="tags">${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
          ${link ? `<a href="${esc(link)}" class="btn btn-outline btn-sm" target="_blank" rel="noopener">${icon('external')} ${esc(has(p.linkLabel) ? p.linkLabel : 'View project')}</a>` : ''}
        </div>
      </article>`;
      }).join('')}
    </div>
  </div>
</section>`;
  }

  function references(c) {
    const items = list(c.references).filter((r) => has(r.name));
    if (!items.length) return '';
    return `
<section id="references">
  <div class="container">
    ${sectionHead('References', 'People who', 'know my work')}
    <div class="refs-grid">
      ${items.map((r, i) => `
      <article class="card reveal d${i % 3 || ''}">
        <div class="ref-head"><div class="avatar">${esc(initials(r.name))}</div><div><h3>${esc(r.name)}</h3>${has(r.role) ? `<small>${esc(r.role)}</small>` : ''}</div></div>
        ${has(r.org) ? `<p class="ref-org">${esc(r.org)}</p>` : ''}
        ${has(r.email) || has(r.phone) ? `<div class="ref-contact">
          ${has(r.email) ? `<a href="mailto:${esc(r.email.trim())}">${icon('mail')} ${esc(r.email)}</a>` : ''}
          ${has(r.phone) ? `<a href="${esc(telHref(r.phone))}">${icon('phone')} ${esc(r.phone)}</a>` : ''}
        </div>` : ''}
      </article>`).join('')}
    </div>
  </div>
</section>`;
  }

  function contact(c) {
    const items = [];
    if (has(c.email)) items.push(['mail', '', 'Email', `<a href="mailto:${esc(c.email.trim())}">${esc(c.email)}</a>`]);
    if (has(c.phone)) items.push(['phone', '', 'Phone', `<a href="${esc(telHref(c.phone))}">${esc(c.phone)}</a>`]);
    if (has(c.location)) items.push(['pin', 'gold', 'Location', `<span>${esc(c.location)}</span>`]);
    const socials = list(c.socials).map((s) => {
      const [label, ic] = SOCIAL[s.platform] || SOCIAL.other;
      let url = String(s.url || '').trim();
      if (s.platform === 'email' && url && !/^mailto:/i.test(url)) url = 'mailto:' + url;
      if (s.platform === 'whatsapp' && /^\+?[\d\s-]+$/.test(url)) url = 'https://wa.me/' + url.replace(/\D/g, '');
      url = safeUrl(url);
      return url ? { label: has(s.label) ? s.label : label, ic, url } : null;
    }).filter(Boolean);
    if (has(c.email) && !socials.some((s) => s.url.startsWith('mailto:'))) {
      socials.push({ label: 'Email', ic: 'mail', url: 'mailto:' + c.email.trim() });
    }
    return `
<section id="contact">
  <div class="container">
    <div class="card contact-box reveal">
      <p class="eyebrow">Contact</p>
      <h2 class="section-title">Let's <span>work together</span></h2>
      ${has(c.contactText) ? `<p>${esc(c.contactText)}</p>` : ''}
      ${items.length ? `<div class="contact-list">${items.map(([ic, cls, label, val]) => `
        <div class="contact-item"><div class="icon-box ${cls}">${icon(ic)}</div><div><small>${label}</small>${val}</div></div>`).join('')}</div>` : ''}
      <div class="socials">
        ${socials.map((s, i) => `<a href="${esc(s.url)}" ${s.url.startsWith('mailto:') ? '' : 'target="_blank" rel="noopener"'} class="btn ${i === 0 ? 'btn-primary' : 'btn-outline'}">${icon(s.ic)} ${esc(s.label)}</a>`).join('')}
      </div>
    </div>
  </div>
</section>`;
  }

  // ---------- page assembly ----------
  const NAV = [
    ['about', 'About'], ['education', 'Education'], ['experience', 'Experience'], ['skills', 'Skills'],
    ['projects', 'Projects'], ['references', 'References'], ['contact', 'Contact'],
  ];

  function render(c) {
    const main = document.getElementById('main');
    main.innerHTML = [
      hero(c),
      about(c),
      timeline('education', 'Education', 'Academic', 'background', c.education, (i) => (i === 0 ? 'grad' : 'award')),
      timeline('experience', 'Experience', 'Professional', 'journey', c.experience, () => 'building'),
      skills(c),
      projects(c),
      references(c),
      contact(c),
    ].join('');
    main.querySelectorAll('section').forEach((s, i) => s.classList.toggle('alt', i % 2 === 0));

    const nameParts = String(c.name || '').trim().split(/\s+/);
    document.getElementById('logo').innerHTML = `${esc(nameParts[nameParts.length - 1] || 'Home')}<span>.</span>`;
    document.getElementById('navLinks').innerHTML = NAV
      .filter(([id]) => document.getElementById(id))
      .map(([id, label]) => `<li><a href="#${id}">${label}</a></li>`).join('');
    document.getElementById('footer').innerHTML =
      `© ${new Date().getFullYear()} <span>${esc(c.name)}</span>${has(c.title) ? ' · ' + esc(c.title) : ''}${has(c.location) ? ' · ' + esc(c.location) : ''}`;
    if (has(c.name)) document.title = c.name + (has(c.title) ? ' — ' + c.title : '');

    wireUp(c);
  }

  // ---------- interactions ----------
  function wireUp(c) {
    const burger = document.getElementById('hamburger');
    const links = document.getElementById('navLinks');
    const setMenu = (open) => {
      burger.classList.toggle('open', open);
      links.classList.toggle('open', open);
      burger.setAttribute('aria-expanded', open);
      burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    };
    burger.onclick = () => setMenu(!links.classList.contains('open'));
    links.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => setMenu(false)));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

    const nav = document.getElementById('nav');
    const toTop = document.getElementById('toTop');
    const onScroll = () => {
      nav.classList.toggle('scrolled', window.scrollY > 20);
      toTop.classList.toggle('show', window.scrollY > 500);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    const revealObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach((el) => revealObs.observe(el));

    const anchors = [...links.querySelectorAll('a')];
    const sectionObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) anchors.forEach((a) => a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id));
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    document.querySelectorAll('main > section, main > header').forEach((s) => sectionObs.observe(s));

    // Project photo galleries
    const galleries = list(c.projects).filter((p) => has(p.title))
      .map((p) => ({ title: p.title, imgs: list(p.images).map(safeUrl).filter(Boolean) }));
    document.querySelectorAll('[data-gallery]').forEach((btn) =>
      btn.addEventListener('click', () => openLightbox(galleries[+btn.dataset.gallery], btn)));
  }

  function openLightbox(g, opener) {
    if (!g || !g.imgs.length) return;
    let idx = 0;
    const box = document.createElement('div');
    box.className = 'lightbox';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-label', g.title + ' photos');
    const multi = g.imgs.length > 1;
    box.innerHTML = `
      <img alt="">
      <button class="lb-btn lb-close" aria-label="Close">${icon('close')}</button>
      ${multi ? `<button class="lb-btn lb-prev" aria-label="Previous photo">${icon('left')}</button>
                 <button class="lb-btn lb-next" aria-label="Next photo">${icon('right')}</button>` : ''}
      <p class="lb-caption"></p>`;
    const img = box.querySelector('img');
    const cap = box.querySelector('.lb-caption');
    const show = (n) => {
      idx = (n + g.imgs.length) % g.imgs.length;
      img.src = g.imgs[idx];
      img.alt = `${g.title}, photo ${idx + 1}`;
      cap.textContent = multi ? `${g.title} · ${idx + 1} / ${g.imgs.length}` : g.title;
    };
    const close = () => {
      box.remove();
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
      opener.focus();
    };
    const onKey = (e) => {
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowRight' && multi) show(idx + 1);
      else if (e.key === 'ArrowLeft' && multi) show(idx - 1);
    };
    box.addEventListener('click', (e) => {
      if (e.target === box) close();
      else if (e.target.closest('.lb-close')) close();
      else if (e.target.closest('.lb-next')) show(idx + 1);
      else if (e.target.closest('.lb-prev')) show(idx - 1);
    });
    let touchX = null;
    box.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
    box.addEventListener('touchend', (e) => {
      if (touchX === null || !multi) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) show(idx + (dx < 0 ? 1 : -1));
      touchX = null;
    });
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    document.body.appendChild(box);
    show(0);
    box.querySelector('.lb-close').focus();
  }

  // ---------- load ----------
  const loader = document.getElementById('loader');
  const load = (tries) => fetch('/api/content', { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .catch((err) => (tries > 1 ? new Promise((ok) => setTimeout(ok, 1500)).then(() => load(tries - 1)) : Promise.reject(err)));
  load(3)
    .then(({ content }) => {
      render(content);
      loader.classList.add('done');
      setTimeout(() => loader.remove(), 500);
    })
    .catch(() => {
      document.getElementById('loaderMsg').textContent = "Couldn't load the page. Please refresh in a moment.";
      loader.querySelector('i').remove();
    });
})();
</script>
</body>
</html>
